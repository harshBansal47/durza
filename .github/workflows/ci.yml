  name: ci

  on:
    push:
      branches: [main]
    pull_request:
    workflow_dispatch:

  concurrency:
    group: ci-${{ github.ref }}
    # A new push must not cancel a run that is in the middle of a deploy: the
    # migration is one transaction against the production database, and killing
    # it half-way is worse than waiting for it to finish.
    #
    # On a pull request there is no deploy, so the superseded run is cancelled
    # and the new one starts immediately. On `main` a push queues behind the
    # run in progress — the deploy job has its own group as well, so a deploy
    # is never cancelled either way.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

  jobs:
    backend:
      name: backend
      runs-on: ubuntu-latest
      # Backstop: GitHub's default job timeout is 6 hours, which is how a stuck
      # test run can burn an hour-plus before anyone notices. Tests time out as
      # failing tests (see the Tests step); this only catches everything else.
      timeout-minutes: 40

      # Tests use a throwaway Postgres inside CI, never your Neon database.
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_USER: durza
            POSTGRES_PASSWORD: durza
            POSTGRES_DB: durza_test
          ports: ["5432:5432"]
          options: >-
            --health-cmd "pg_isready -U durza"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

      steps:
        - uses: actions/checkout@v4

        - uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

        - name: Install
          run: uv sync --frozen --extra dev

        - name: Ruff lint
          run: uv run ruff check app/ tests/ mcp_server/

        - name: Ruff format check
          run: uv run ruff format --check app/ tests/ mcp_server/

        - name: Type check
          run: uv run mypy app --ignore-missing-imports --no-strict-optional

        - name: Tests
          # If the suite ever wedges again, the step fails at 20 minutes with
          # the log showing exactly which test stalled - rather than sitting
          # green-adjacent for an hour. `--durations` prints the slowest tests.
          timeout-minutes: 20
          env:
            TEST_DATABASE_URL: postgresql+asyncpg://durza:durza@localhost:5432/durza_test
            ENVIRONMENT: test
            SCHEDULER_ENABLED: "false"
          run: uv run pytest tests/ -q --durations=25 --cov=app

        - name: Destructive-migration guard
          run: uv run python scripts/check_destructive_migrations.py

        - name: Migrations apply cleanly to an empty database
          env:
            DATABASE_URL: postgresql+asyncpg://durza:durza@localhost:5432/durza_test
          run: uv run alembic upgrade head

        - name: Models and migrations have not drifted
          env:
            DATABASE_URL: postgresql+asyncpg://durza:durza@localhost:5432/durza_test
          run: |
            uv run alembic check || (
              echo "::error::alembic check failed. Either the models changed without a migration (run 'alembic revision --autogenerate -m ...'), or alembic could not run/connect - see the traceback above."
              exit 1
            )

    migrate-check:
      name: migrations down then up
      runs-on: ubuntu-latest
      needs: backend
      timeout-minutes: 30

      # A throwaway Postgres, never the Neon database. `alembic downgrade base`
      # drops every table, so this must never run against anything real.
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_USER: durza
            POSTGRES_PASSWORD: durza
            POSTGRES_DB: durza_migrate
          ports: ["5432:5432"]
          options: >-
            --health-cmd "pg_isready -U durza"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

      # Job-level, not per-step. `database_url` is a required setting with no
      # default, so a step that forgets it does not fall back to something
      # harmless - it fails at import time. Setting it once here means no step
      # can forget. ENVIRONMENT is not production, so the guard in
      # alembic/env.py does not block this job.
      env:
        ENVIRONMENT: test
        DATABASE_URL: postgresql+asyncpg://durza:durza@localhost:5432/durza_migrate

      steps:
        - uses: actions/checkout@v4
        - uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"
        - run: uv sync --frozen --extra dev

        - name: Upgrade, seed, downgrade to base, upgrade again
          # A migration that cannot be rolled back is a migration nobody can
          # safely deploy: the only recovery from a bad one becomes restoring a
          # database from backup, which is an outage measured in how stale the
          # backup is.
          #
          # Every table is seeded before the downgrade, because dropping an
          # *empty* table only proves the DROP statement parses. The seed fills
          # every NOT NULL column from the real schema, satisfies the CHECK
          # constraints, and resolves foreign keys against rows it already
          # inserted, so a migration that made a column NOT NULL without a
          # default or a backfill fails here rather than in production.
          run: |
            uv run alembic upgrade head

            uv run python scripts/migration_roundtrip.py seed

            uv run alembic downgrade base
            uv run alembic upgrade head

            # The re-upgrade has to leave every seeded table empty, not resurrected.
            uv run python scripts/migration_roundtrip.py check

            # And the re-upgraded schema has to be the schema the models describe.
            uv run alembic check

            # A deploy with nothing pending has to succeed too: the migration
            # command runs on every deploy, so it must be a no-op when the
            # schema is already at head.
            uv run alembic upgrade head

    deploy:
      name: deploy
      # Wait for the roundtrip job too: if the migration chain cannot be
      # downgraded and re-upgraded with data in it, it is not safe to deploy
      # to the database that holds the real rows.
      needs: [backend, migrate-check]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      # Deploys queue behind each other and are never cancelled. A deploy that
      # is interrupted while the migration is running leaves the database half
      # migrated, so a second deploy waits for the first one to finish rather
      # than racing it or replacing it.
      concurrency:
        group: ${{ github.workflow }}-deploy
        cancel-in-progress: false
      runs-on: ubuntu-latest
      env:
        VM_HOST: ${{ secrets.VM_HOST }}
        VM_USER: ${{ secrets.VM_USER }}
        VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}

      steps:
        # Job-level `paths:` is not a thing in GitHub Actions — a workflow
        # trigger filters the whole workflow, and that would stop the tests
        # from running on a docs-only push. So the filter is computed here
        # and the deploy steps are skipped when nothing that can change the
        # running artefact changed.
        #
        # The list has to stay complete: a file left out merges without
        # deploying. The backend and migrate-check jobs still run on every
        # push, so the tests remain the gate; only the deploy is filtered.
        #
        # The baseline is the last SHA that was **successfully deployed**,
        # recorded on the host at the end of a successful deploy — not the
        # previous head of `main`. If a deploy failed, its changes were never
        # applied, so a later docs-only push still has to deploy, and diffing
        # against the previous head would skip it.
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up SSH
          run: |
            mkdir -p ~/.ssh
            echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

        - name: Detect whether this push can change what runs
          id: changes
          run: |
            set -euo pipefail
            # The last SHA that was successfully deployed, read from the host.
            # A missing file means we do not know what is running, and the
            # script deploys in that case.
            if ! ssh -o BatchMode=yes -o ConnectTimeout=15 "$VM_USER@$VM_HOST" \
                 "cat ~/.last-deployed-sha 2>/dev/null || true" \
                 > "$RUNNER_TEMP/last-deployed-sha"; then
              # The host could not be reached, or the read failed. We do not
              # know what is running, so we deploy rather than skip a push.
              echo "could not read the last deployed SHA from the host; deploying" >&2
              echo "deploy=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "last deployed sha: $(cat "$RUNNER_TEMP/last-deployed-sha" 2>/dev/null || echo '<none>')"
            bash scripts/deploy_change_detection.sh \
              . "${{ github.sha }}" "${{ github.event.before }}" "$RUNNER_TEMP/last-deployed-sha" \
              >> "$GITHUB_OUTPUT"

        # The VM's own .env holds the Neon and Upstash URLs.
        #
        # Order matters here, and it is the opposite of the obvious one:
        #
        #   1. build the new image, but do not start it;
        #   2. run the migration in a throwaway container built from that new
        #      image, so the migration code is the code being deployed;
        #   3. only then start the new app container.
        #
        # If the migration fails, the old container is still running the old
        # code against the old schema, and the deploy fails loudly without
        # having replaced a working service with a half-migrated one.
        #
        # `-T` disables the pseudo-TTY that `podman-compose run` allocates by
        # default: over a non-interactive SSH there is no TTY to allocate, and
        # the run would fail before the migration started.
        #
        # `-e ALLOW_PROD_MIGRATION=1` is the per-run override the production
        # guard asks for. It is passed to this one container and nowhere else:
        # it is not written into the VM's .env, so no later, unrelated run can
        # pick it up, and it disappears with the container.
        #
        # `podman image prune -f` was deliberately left out of the Phase 5
        # deploy so the previous image stayed on the VM for an immediate
        # rollback (see docs/ROLLBACK.md). It is back now: an image that has
        # been tagged for rollback is not dangling, and prune only removes the
        # dangling ones.
        - name: Pull, build, migrate, then start
          if: steps.changes.outputs.deploy == 'yes'
          run: |
            ssh "$VM_USER@$VM_HOST" "cd ~/durza \
              && git pull origin main \
              && podman-compose build app \
              && podman-compose run --rm --no-deps -T -e ALLOW_PROD_MIGRATION=1 app alembic upgrade head \
              && podman-compose up -d app \
              && podman image prune -f"

        # Record what is now deployed, so the next push can be diffed against
        # it. This runs only when the deploy above succeeded: a failed deploy
        # leaves the recorded SHA alone, so the next push deploys again.
        - name: Record the deployed SHA
          if: steps.changes.outputs.deploy == 'yes'
          run: |
            set -euo pipefail
            ssh "$VM_USER@$VM_HOST" \
              "git -C ~/durza rev-parse HEAD > ~/.last-deployed-sha"
