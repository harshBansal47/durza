services:
  db:
    # Fully qualified: the deploy host's podman defines no
    # unqualified-search-registries, so a bare `postgres:16` dies with
    # "short-name ... did not resolve to an alias".
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: durza
      POSTGRES_PASSWORD: durza
      POSTGRES_DB: durza
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durza"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
